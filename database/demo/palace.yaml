  - slug: project-quarry
    name: "project:quarry"
    description: A Rust CLI that searches your shell history.
    rooms:
      - slug: notes
        name: Notes
        drawers:
          - key: qy-origin
            days_ago: 94
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.83}
            content: >
              Quarry exists because Ctrl-R cannot answer "what was that rsync I ran in this
              directory last month?". Goal: search history by text, directory, date and exit
              code, from one small binary.
          - key: qy-parse-zsh
            days_ago: 90
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.88}
            content: >
              zsh extended history lines look like ": 1712345678:0;cargo build". Multi-line
              commands continue with a trailing backslash, so the parser joins lines until one
              does not end in an unescaped backslash.
          - key: qy-fuzzy
            days_ago: 85
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.8}
            content: >
              Tried fuzzy matching; the top results were noise for short queries like "git p".
              Went with token prefix matching ranked by recency and frequency.
          - key: qy-index
            days_ago: 80
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.9}
            content: >
              The index is a SQLite file with an FTS5 table, kept under the XDG data
              directory. Indexing 48,000 history lines takes 0.6 s; queries return in under
              10 ms.
          - key: qy-bash-history-no-timestamps
            days_ago: 69
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.76}
            content: >
              bash history has no timestamps unless HISTTIMEFORMAT was set when the commands
              ran. Quarry imports those lines in file order with no date and says so in
              quarry stats.
          - key: qy-hook-latency
            days_ago: 58
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.91}
            content: >
              The precmd hook that records cwd and exit code added 11 ms to every prompt
              because it spawned the binary. It now appends a line to a log file in shell, and
              Quarry indexes the log lazily on the next search: 0.4 ms per prompt.
          - key: qy-fish-request
            days_ago: 44
            source: manual
            metadata: {captured_via: manual}
            content: >
              Issue #9 asks for fish support. Third person to ask. fish keeps history in its own
              YAML-like format.
          - key: qy-fish-parser
            days_ago: 37
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.82}
            content: >
              fish history parser done: reads "- cmd:" and "when:" entries and ignores the
              "paths:" list. Wrote it by hand rather than pulling in a YAML crate, since fish's
              format is not quite YAML.
          - key: qy-secrets-filter
            days_ago: 26
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.88}
            content: >
              Quarry no longer indexes commands that export variables whose names end in
              TOKEN, KEY, SECRET or PASSWORD, or that pass a password flag. They are skipped at
              index time, not hidden at search time, so they never reach the database.
          - key: qy-stars
            days_ago: 21
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.72}
            content: >
              A post in a terminal-tools forum took Quarry from 12 to 140 GitHub stars in a day.
              Six issues opened; four were install problems on older Linux distributions.
          - key: qy-windows-declined
            days_ago: 17
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.81}
            content: >
              Closed the Windows support issue as out of scope: PowerShell history has no
              timestamps or directories, so most of Quarry's filters would do nothing there.
          - key: qy-musl-build
            days_ago: 6
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.86}
            content: >
              Release builds are now static musl binaries. The glibc build failed on older
              distributions with "version GLIBC_2.34 not found", which was most of the install
              issues after the forum post.
          - key: qy-clap-bump
            days_ago: 2
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.6}
            content: >
              Bumped clap to 4.5 and regenerated shell completions. No behaviour change.
      - slug: releases
        name: Releases
        drawers:
          - key: qy-release-0-1
            days_ago: 76
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.87}
            content: >
              Quarry 0.1.0 published to crates.io: zsh and bash import, text search, --since.
              Announced nowhere; three downloads that weren't Rowan.
          - key: qy-release-0-2
            days_ago: 62
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.85}
            content: >
              0.2.0: --cwd and --failed filters, backed by a precmd hook installed with
              quarry init zsh.
          - key: qy-release-0-3
            days_ago: 50
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.83}
            content: >
              0.3.0: the hook writes to a log instead of spawning the binary (prompt latency
              11 ms → 0.4 ms). Index format changed; the first run rebuilds it.
          - key: qy-release-0-4
            days_ago: 33
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.84}
            content: >
              0.4.0: fish support, and quarry import --dry-run to preview what would be
              indexed.
          - key: qy-release-0-5
            days_ago: 11
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.87}
            content: >
              0.5.0: quarry stats (most-run commands, failure rate per directory) and the
              secret filter. Binary is 2.1 MB stripped.

  - slug: decisions
    name: decisions
    description: Cross-project decisions about architecture and tooling.
    rooms:
      - slug: architecture
        name: Architecture
        drawers:
          - key: dec-one-vps
            days_ago: 90
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.92}
            content: >
              Consolidated three small VPSs into one 4 vCPU / 8 GB machine. Saves $22/month
              and one set of OS upgrades. The products are small enough that noisy neighbours
              are each other.
          - key: dec-quarry-rust
            days_ago: 92
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.84}
            content: >
              Quarry is written in Rust, the one language Rowan does not already use daily.
              Reasons: a single static binary to distribute, and startup fast enough to run
              on every keypress.
          - key: dec-caddy
            days_ago: 88
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.87}
            content: >
              Caddy replaces nginx plus certbot. One 20-line Caddyfile serves all three
              products with automatic TLS; the certbot renewal timer had failed silently once.
          - key: dec-pg-on-vps
            days_ago: 78
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.86}
            content: >
              Ledgerline's Postgres stays on the VPS rather than a managed service. Nightly
              pg_dump to object storage plus a monthly restore check is enough at 212 MB.
          - key: dec-tp-sqlite
            days_ago: 74
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.94}
            content: >
              Tidepool moves from managed Postgres to a single SQLite file on the VPS. The
              Postgres instance cost more than the VPS, and the workload is one nightly writer
              and many readers. Revisit if user accounts ever add concurrent writes.
          - key: dec-ll-billing-portal
            days_ago: 63
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.91}
            content: >
              Ledgerline uses Stripe's hosted billing portal for plan changes, card updates,
              invoices and cancellation, instead of building those pages. Roughly two weeks of
              work avoided; the cost is that the portal looks like Stripe, not Ledgerline.
          - key: dec-boring-budget
            days_ago: 60
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.89}
            content: >
              Wrote down the rule Rowan has been following: each product may spend one "new
              technology". Tidepool spent it on service workers, Quarry on Rust. Ledgerline has
              spent none and should keep it that way while it pays the bills.
          - key: dec-backup-drills
            days_ago: 53
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.88}
            content: >
              Every product with data gets a restore drill at least quarterly, on a scratch
              machine, with row counts compared. A backup nobody has restored does not count.
      - slug: tooling
        name: Tooling
        drawers:
          - key: dec-deploy-script
            days_ago: 86
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.85}
            content: >
              Deploys are a 30-line shell script: build locally, rsync to a new release
              directory, flip the current symlink, restart the unit. Rollback flips the symlink
              back.
          - key: dec-ci-tests-only
            days_ago: 81
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.8}
            content: >
              CI runs tests and linters on push but does not deploy. Deploying stays a
              deliberate local command, so a green build at 2 a.m. cannot ship anything.
          - key: dec-error-tracking
            days_ago: 65
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.82}
            content: >
              No hosted error tracker. A nightly script greps the three apps' logs for errors,
              groups them by message and emails a digest. The hosted option was $26/month,
              more than the VPS.
          - key: dec-uptime-monitor
            days_ago: 47
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.84}
            content: >
              Tomás set up uptime checks for the three products, one request a minute each.
              Alerts go to him and Rowan; he wrote the runbook entry for each alert.
          - key: dec-codex-for-rust
            days_ago: 40
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.73}
            content: >
              Quarry's Rust work moves to Codex; PHP and JavaScript stay mostly in Claude Code.
              Both harnesses feed the same Mnemon, so decisions end up in one place either way.
          - key: dec-renovate-off
            days_ago: 33
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.78}
            content: >
              Turned off automated dependency pull requests: 31 open in a month, mostly patch
              bumps. Replaced by a dependency day on the first Monday of each month.
          - key: dec-cron-healthchecks
            days_ago: 20
            source: claude-code:session_digest
            metadata: {captured_via: session_digest, harness: claude-code, confidence: 0.88}
            content: >
              After Tidepool's silent import failures: every cron job pings a healthcheck when
              it finishes, and a missing ping alerts Tomás and Rowan. Five jobs across the
              three products.
          - key: dec-dns-ttl
            days_ago: 10
            source: codex:session_digest
            metadata: {captured_via: session_digest, harness: codex, confidence: 0.61}
            content: >
              Lowered DNS TTLs on all three domains to 300 seconds, ahead of possibly moving the
              VPS to a bigger plan.

